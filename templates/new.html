{% extends "base.html" %}
{% block content %}
<h1>File a complaint</h1>
<p class="sub">Fields marked * are required.</p>

<form method="post" class="panel form">
  <div class="grid2">
    <label>Full name *<input name="name" value="{{ form.get('name','') }}" required></label>
    <label>Email *<input type="email" name="email" value="{{ form.get('email','') }}" required></label>
    <label>Phone<input name="phone" value="{{ form.get('phone','') }}"></label>
    <label>Order ID *<input name="order_id" placeholder="e.g. ORD-129384" value="{{ form.get('order_id','') }}" required></label>
    <label>Product *<input name="product" value="{{ form.get('product','') }}" required></label>
    <label>Order amount<input name="amount" type="number" step="0.01" value="{{ form.get('amount','') }}"></label>
    <label>Order date<input type="date" name="order_date" value="{{ form.get('order_date','') }}"></label>
    <label>Promised delivery date<input type="date" name="expected_date" value="{{ form.get('expected_date','') }}"></label>
    <label>Issue type *
      <select name="issue_type" required>
        {% for t in issue_types %}
        <option value="{{ t }}" {% if form.get('issue_type')==t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Preferred resolution
      <select name="resolution">
        {% for r in ['Refund', 'Replacement', 'Redelivery', 'Explanation only'] %}
        <option value="{{ r }}" {% if form.get('resolution')==r %}selected{% endif %}>{{ r }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <label>What happened? *<textarea name="description" rows="5" required>{{ form.get('description','') }}</textarea></label>
  <button class="btn primary" type="submit">Submit complaint</button>
</form>
{% endblock %}

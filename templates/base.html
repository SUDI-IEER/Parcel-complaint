<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ParcelCare — Complaint Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('home') }}">📦 ParcelCare</a>
    <nav>
      <a href="{{ url_for('new_complaint') }}">File a complaint</a>
      <a href="{{ url_for('track_search') }}">Track status</a>
      <a class="admin-link" href="{{ url_for('admin') }}">Support desk</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer>ParcelCare — complaint portal for undelivered online orders.</footer>
</body>
</html>
